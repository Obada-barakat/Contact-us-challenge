<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <title>Contact Form</title>
</head>
<body>
    <div class="contact_us_container">
        <h3 class="title">Contact Us</h3>
        <div class="form_container">
            <form id="my_form">
                <div class="user_name">
                    <div>
                        <label for="first_name" class="label">First Name <span class="mandatory">*</span></label>
                        <input type="text" id="first_name" required aria-required="true">
                        <span class="error" id="first_name_error"></span>
                    </div>
        
                    <div>
                        <label for="last_name" class="label">Last Name <span class="mandatory">*</span></label>
                        <input type="text" id="last_name" required aria-required="true">
                        <span class="error" id="last_name_error"></span>
                    </div>
                </div>
        
                <div>
                    <label for="email" class="label">Email <span class="mandatory">*</span></label>
                    <input type="email" id="email" required aria-required="true">
                    <span class="error" id="email_error"></span>
                </div>
        
        
                <div class="query_type">
                    <h5 class="label">Query type <span class="mandatory">*</span></h5>
                    <div>
                        <label>
                            <input type="radio" name="query_type" value="support_enquiry">
                            <span class="custom-radio"></span>
                            Support Enquiry
                        </label>
                        <label>
                            <input type="radio" name="query_type" value="general_enquiry"> 
                            <span class="custom-radio"></span>
                            General Enquiry
                        </label>
                        <span class="error" id="radio_error"></span>

                    </div>
                </div>
        
                <div>
                    <label for="message" class="label">Message <span class="mandatory">*</span></label>
                    <textarea name="message" id="message" required rows="5" placeholder="Your message" maxlength="150"></textarea>
                    <span class="error" id="message_error"></span>
                </div>
        
                <div>
                    <input type="checkbox" id="consent" name="consent">
                    <label for="consent">I consent to being contacted by the team <span class="mandatory">*</span></label>
                    <span class="error" id="consent_error"></span>
                </div>

                <div>
                    <button type="submit">Submit</button>
                </div>
            </form>
        </div>
        <span id="successful"> 
            <i class="fa-regular fa-circle-check"></i> Message Sent! <br>
            <p>Thanks for completing the form, we'll be in touch soon!</p>
        </span>
    </div>
    <script src="main.js"></script>
</body>
</html>
